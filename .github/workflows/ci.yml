name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  MPLBACKEND: Agg

jobs:
  python-rust:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Create virtual environment
        shell: bash
        run: |
          python -m venv .venv
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            echo "VENV_PY=.venv/Scripts/python.exe" >> "${GITHUB_ENV}"
          else
            echo "VENV_PY=.venv/bin/python" >> "${GITHUB_ENV}"
          fi

      - name: Install build tools
        shell: bash
        run: |
          "${VENV_PY}" -m pip install --upgrade pip
          "${VENV_PY}" -m pip install maturin pytest "matplotlib>=3.8"

      - name: Verify required original JWC fixtures
        shell: bash
        run: '"${VENV_PY}" scripts/jwc/check_corpus.py'

      - name: Rust checks
        run: |
          cargo fmt --all --check
          cargo test --workspace --locked --quiet
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Python tests (maturin develop)
        shell: bash
        run: |
          "${VENV_PY}" -m maturin develop --release --locked
          "${VENV_PY}" -m ezjww info jww_samples/Test1.jww
          "${VENV_PY}" -m ezjww audit jww_samples/Test1.jww --json
          "${VENV_PY}" -m ezjww bbox jww_samples/Test1.jww --json --explode-inserts
          "${VENV_PY}" -m ezjww stats jww_samples/Test1.jww --json
          "${VENV_PY}" -m ezjww report jww_samples/Test1.jww --json --explode-inserts
          "${VENV_PY}" -m ezjww info jwc_samples/generated/q032.jwc --json
          "${VENV_PY}" -m ezjww report jwc_samples/generated/q032.jwc --json
          "${VENV_PY}" -m ezjww bbox jwc_samples/generated/q054.jwc --json --jwc-coordinates model_millimeters
          "${VENV_PY}" -m ezjww plot jwc_samples/generated/q032.jwc -o "${RUNNER_TEMP}/jwc-preview.png"
          "${VENV_PY}" -m pytest -q tests/python

      - name: Build wheel
        shell: bash
        run: |
          rm -f src/ezjww/_core.pyd src/ezjww/_core.so src/ezjww/_core.abi3.so src/ezjww/_core.dll src/ezjww/_core.dylib
          "${VENV_PY}" -m maturin build --release --locked --out dist
          "${VENV_PY}" -c "from pathlib import Path; wheels = list(Path('dist').glob('*.whl')); assert wheels, 'no wheel produced'; print(wheels[0].name)"

      - name: Install and verify wheel outside source tree
        shell: bash
        run: '"${VENV_PY}" scripts/check-wheel.py --wheel-dir dist --report "${RUNNER_TEMP}/jwc-wheel.json"'

  typescript-parity:
    name: TypeScript package parity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm@9.15.1

      - name: Install Python dependencies
        run: |
          uv sync --extra plot
          uv pip install maturin

      - name: Verify required original JWC fixtures
        run: python scripts/jwc/check_corpus.py

      - name: Install TypeScript dependencies
        run: pnpm install --frozen-lockfile
        working-directory: packages/ezjww

      - name: Check wasm target
        run: |
          cargo build -p ezjww-wasm --target wasm32-unknown-unknown --locked
          cargo clippy -p ezjww-wasm --target wasm32-unknown-unknown --locked -- -D warnings

      - name: Build Python extension
        run: uv run maturin develop

      - name: Test TypeScript package
        run: pnpm run test
        working-directory: packages/ezjww

      - name: Check public and test TypeScript types
        run: pnpm run typecheck
        working-directory: packages/ezjww

      - name: Build browser example
        run: pnpm run example:browser:build
        working-directory: packages/ezjww

      - name: Check Python/TypeScript parity
        run: pnpm run test:parity
        working-directory: packages/ezjww

      - name: Pack npm package
        id: pack-npm
        run: |
          pack_file="$(pnpm pack --pack-destination /tmp | tail -n 1)"
          echo "pack-file=${pack_file}" >> "${GITHUB_OUTPUT}"
        working-directory: packages/ezjww

      - name: Smoke packed npm package
        run: |
          node scripts/check-npm-package.mjs --archive "${{ steps.pack-npm.outputs.pack-file }}" --report "${RUNNER_TEMP}/jwc-npm.json"
          package_path="$(node -p "require(process.env.RUNNER_TEMP + '/jwc-npm.json').workdir + '/node_modules/ezjww'")"
          node scripts/check-python-ts-parity.mjs --package "${package_path}"

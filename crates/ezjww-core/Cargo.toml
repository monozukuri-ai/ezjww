[package]
name = "ezjww-core"
version.workspace = true
edition = "2021"
description = "Jw_cad JWW/JWC/JWS reader, JWW writer and DXF converter"
keywords = ["jww", "jw_cad", "cad", "dxf", "parser"]
license = "MIT"
repository = "https://github.com/monozukuri-ai/ezjww"

[dependencies]
encoding_rs = "0.8.35"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

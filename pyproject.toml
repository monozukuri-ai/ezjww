[project]
name = "ezjww"
version = "0.6.0"
description = "JWW/JWC reader, JWW writer and DXF converter powered by Rust"
license = { file = "LICENSE" }
readme = "README.md"
authors = [
    { name = "neka-nat", email = "nekanat.stock@gmail.com" }
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.scripts]
ezjww = "ezjww:main"

[tool.maturin]
module-name = "ezjww._core"
python-packages = ["ezjww"]
python-source = "src"
exclude = [".internal/**"]
# Keep every workspace manifest with the shared lockfile. The cargo generator
# prunes the WASM member while retaining its lock entries, breaking --locked.
sdist-generator = "git"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
